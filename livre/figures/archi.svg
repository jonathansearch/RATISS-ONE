  <defs><marker id="fl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1A1A2E"/></marker></defs>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="20" y="120" width="140" height="96" rx="12" fill="#1B6CA8"/><text x="90" y="152" fill="#fff">👂 OREILLE</text>
    <text x="90" y="172" font-size="11" font-weight="normal" fill="#EAF3FA">Phonon-2 / whisper</text>
