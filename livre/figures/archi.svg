    <text x="275" y="188" font-size="11" font-weight="normal" fill="#F1EAFE">comprendre = résonner</text>
    <rect x="390" y="120" width="170" height="96" rx="12" fill="#C9A227"/><text x="475" y="152" fill="#1A1A2E">🏛️ SECTEURS</text>
