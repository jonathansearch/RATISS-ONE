<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="2" y="2" width="916" height="356" rx="16" fill="#FAF7F0" stroke="#E8E0D0" stroke-width="2"/>
