<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="2" y="2" width="756" height="356" rx="16" fill="#FAF7F0" stroke="#E8E0D0" stroke-width="2"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1A1A2E" text-anchor="middle">🔁 La grande boucle — entendre, rêver, dire, graver</text>
  <defs><marker id="fl3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1A1A2E"/></marker></defs>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="30" y="120" width="120" height="80" rx="12" fill="#1B6CA8"/><text x="90" y="150" fill="#fff">👂 1. ÉCOUTE</text><text x="90" y="170" font-size="11" font-weight="normal" fill="#EAF3FA">le tissu entend</text><text x="90" y="185" font-size="11" font-weight="normal" fill="#EAF3FA">tout de suite</text>
    <rect x="175" y="120" width="120" height="80" rx="12" fill="#1B6CA8"/><text x="235" y="150" fill="#fff">🌊 2. TAMPON</text><text x="235" y="170" font-size="11" font-weight="normal" fill="#EAF3FA">la nuit</text><text x="235" y="185" font-size="11" font-weight="normal" fill="#EAF3FA">consolide</text>
    <rect x="320" y="120" width="120" height="80" rx="12" fill="#7C3AED"/><text x="380" y="150" fill="#fff">💭 3. RÊVE</text><text x="380" y="170" font-size="11" font-weight="normal" fill="#F1EAFE">ravive les riches</text><text x="380" y="185" font-size="11" font-weight="normal" fill="#F1EAFE">≥ 2 compris</text>
    <rect x="465" y="120" width="120" height="80" rx="12" fill="#C9A227"/><text x="525" y="150" fill="#1A1A2E">🏛️ 4. SANCT.</text><text x="525" y="170" font-size="11" fill="#1A1A2E">la mer garde</text><text x="525" y="185" font-size="11" fill="#1A1A2E">le niveau 60</text>
    <rect x="610" y="120" width="120" height="80" rx="12" fill="#1E9E6A"/><text x="670" y="150" fill="#fff">🗣️ 5. DIT</text><text x="670" y="170" font-size="11" font-weight="normal" fill="#E9F7EF">4 règles,</text><text x="670" y="185" font-size="11" font-weight="normal" fill="#E9F7EF">zéro singulier</text>
  </g>
  <g stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#fl3)">
    <line x1="150" y1="160" x2="171" y2="160"/><line x1="295" y1="160" x2="316" y2="160"/>
    <line x1="440" y1="160" x2="461" y2="160"/><line x1="585" y1="160" x2="606" y2="160"/>
  </g>
  <path d="M670 200 L670 280 L90 280 L90 204" fill="none" stroke="#7C3AED" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#fl3)"/>
  <rect x="230" y="258" width="300" height="44" rx="12" fill="#7C3AED"/>
  <text x="380" y="278" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">🔁 6. RÉ-ENTEND → 3× = 🪨 GRAVÉ</text>
  <text x="380" y="295" font-size="11" fill="#F1EAFE" text-anchor="middle">ce que la bouche dit, l'oreille le ré-entend</text>
  <text x="380" y="336" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">La boucle fermée, c'est l'autonomie : le cerveau se relit sa leçon tout seul (leçons 15-17).</text>
</svg>
