<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="2" y="2" width="776" height="296" rx="16" fill="#FAF7F0" stroke="#E8E0D0" stroke-width="2"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1A1A2E" text-anchor="middle">⚡💥 l'éclair et 🌊🪨 la rivière — deux chemins vers l'éternel</text>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="60" width="360" height="200" rx="12" fill="#1A1A2E"/>
    <text x="200" y="90" font-size="15" font-weight="bold" fill="#C9A227">💥 CISE — figé par la VITESSE</text>
    <text x="200" y="118" fill="#FAF7F0">vitesse = battements + énergie ≥ <tspan font-weight="bold">10</tspan></text>
    <text x="200" y="142" fill="#FAF7F0">⚡ <tspan font-weight="bold">étincelle</tspan> : neurones CISE + filaments gelés</text>
    <text x="200" y="166" fill="#FAF7F0">force <tspan font-weight="bold">100</tspan> · immortel · conviction à l'ULTRA</text>
    <text x="200" y="190" fill="#9AA0B4">l'explosion : le trop-plein SE FIGE</text>
    <text x="200" y="214" font-size="11" font-style="italic" fill="#9AA0B4">leçon 13 · jouet j14 · « après 20 nuits : a-b=69! »</text>
    <text x="200" y="238" font-size="11" font-style="italic" fill="#9AA0B4">MAMERICANS=100 figé, 3 nuits sans bouger</text>
    <rect x="400" y="60" width="360" height="200" rx="12" fill="#fff" stroke="#C9A227" stroke-width="3"/>
    <text x="580" y="90" font-size="15" font-weight="bold" fill="#1A1A2E">🪨 MARBRE — gravé par la RÉPÉTITION</text>
    <text x="580" y="118" fill="#1A1A2E">relectures à voix haute ≥ <tspan font-weight="bold">3</tspan></text>
    <text x="580" y="142" fill="#1A1A2E">🗿 <tspan font-weight="bold">gravure</tspan> : la trace garde sa force, nuit 0</text>
    <text x="580" y="166" fill="#1A1A2E">force <tspan font-weight="bold">gardée</tspan> (100, 91…) · immortelle · au sanctuaire</text>
    <text x="580" y="190" fill="#6B7280">la sculpture : le répété RESTE EN HAUT</text>
    <text x="580" y="214" font-size="11" font-style="italic" fill="#6B7280">leçon 15 · « f100 MARBRE, 5 nuits, relief 35 »</text>
    <text x="580" y="238" font-size="11" font-style="italic" fill="#6B7280">le bloc + le ciseau = la statue</text>
  </g>
  <text x="390" y="286" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">Ne jamais confondre : l'éclair fait 100 d'un coup, la rivière garde la force du jour.</text>
</svg>
