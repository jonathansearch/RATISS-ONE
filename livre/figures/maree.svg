<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="2" y="2" width="776" height="316" rx="16" fill="#FAF7F0" stroke="#E8E0D0" stroke-width="2"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1A1A2E" text-anchor="middle">🌊 La marée — le jour écoute, la nuit consolide</text>
  <defs><marker id="fl4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1A1A2E"/></marker></defs>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="70" width="230" height="170" rx="12" fill="#1B6CA8"/>
    <text x="135" y="100" font-weight="bold" fill="#fff">☀️ LE JOUR — la vague</text>
    <text x="135" y="126" fill="#EAF3FA">70 inconnues arrivent</text>
    <text x="135" y="148" fill="#fff" font-weight="bold">tampon : 50 en attente</text>
    <text x="135" y="170" fill="#fff" font-weight="bold">pression : 20 au VIF</text>
    <text x="135" y="196" fill="#EAF3FA">soupape : zéro perte, jamais</text>
    <text x="135" y="218" font-size="11" fill="#EAF3FA">le tissu entend tout de suite</text>
    <rect x="275" y="70" width="230" height="170" rx="12" fill="#1A1A2E"/>
    <text x="390" y="100" font-weight="bold" fill="#C9A227">🌙 LA NUIT — le flush</text>
    <text x="390" y="126" fill="#FAF7F0">le tampon se vide : <tspan font-weight="bold">50</tspan></text>
    <text x="390" y="148" fill="#FAF7F0">VIF = les <tspan font-weight="bold">20 dernières</tspan></text>
    <text x="390" y="170" fill="#FAF7F0">bruit à <tspan font-weight="bold">f10</tspan>, puis mort</text>
    <text x="390" y="196" fill="#FAF7F0">le rêve ravive les riches</text>
    <text x="390" y="218" font-size="11" fill="#9AA0B4">l'oubli fait la mémoire</text>
    <rect x="530" y="70" width="230" height="170" rx="12" fill="#fff" stroke="#C9A227" stroke-width="3"/>
    <text x="645" y="100" font-weight="bold" fill="#1A1A2E">🗿 5 NUITS — mer calme</text>
    <text x="645" y="126" fill="#1A1A2E">statue : <tspan font-weight="bold">f100 MARBRE</tspan> ★</text>
    <text x="645" y="148" fill="#1A1A2E">témoin B coulé à <tspan font-weight="bold">f65</tspan></text>
    <text x="645" y="170" fill="#1A1A2E">relief : <tspan font-weight="bold">35</tspan> (était 13 !)</text>
    <text x="645" y="196" fill="#1A1A2E">VIF <tspan font-weight="bold">0</tspan>, REFRAIN <tspan font-weight="bold">0</tspan></text>
    <text x="645" y="218" font-size="11" fill="#6B7280">la même phrase avant/après 🌪️</text>
  </g>
  <g stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#fl4)">
    <line x1="252" y1="155" x2="271" y2="155"/><line x1="507" y1="155" x2="526" y2="155"/>
  </g>
  <text x="390" y="274" font-size="12" fill="#1A1A2E" text-anchor="middle">Homéostasie : perte = <tspan font-weight="bold">1 + (force−60)//4</tspan>, plancher <tspan font-weight="bold">60</tspan> — le bruit redescend, la statue reste.</text>
  <text x="390" y="298" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">Tempête mesurée : MAREE OK — 70 absorbées, 50 vidées, mer calme (leçon 16).</text>
</svg>
