<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="2" y="2" width="776" height="316" rx="16" fill="#FAF7F0" stroke="#E8E0D0" stroke-width="2"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1A1A2E" text-anchor="middle">💭 Le rêve — on ne garde que ce qu'on comprend</text>
  <defs><marker id="fl5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1A1A2E"/></marker></defs>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="70" width="220" height="150" rx="12" fill="#6B7280"/>
    <text x="130" y="100" font-weight="bold" fill="#fff">🌪️ CHAOS — 1 écoute</text>
    <text x="130" y="126" fill="#fff">JFK : 20 fenêtres ×1</text>
    <text x="130" y="148" fill="#fff">FR : 19 fenêtres ×1</text>
    <text x="130" y="170" fill="#fff">sans focus, sans filet</text>
    <text x="130" y="196" font-size="11" fill="#E5E7EB">sans rêve : 0/0/0 prouvé 💀</text>
    <rect x="270" y="70" width="220" height="150" rx="12" fill="#7C3AED"/>
    <text x="380" y="100" font-weight="bold" fill="#fff">💭 RÊVE — chaque nuit</text>
    <text x="380" y="126" fill="#fff">ravive les riches :</text>
    <text x="380" y="148" font-weight="bold" fill="#fff">≥ 2 mots compris</text>
    <text x="380" y="170" fill="#F1EAFE">FR : 1 rêve sur 19 !</text>
    <text x="380" y="196" font-size="11" fill="#F1EAFE">JFK : 3 rêves sur 20</text>
    <rect x="520" y="70" width="240" height="150" rx="12" fill="#C9A227"/>
    <text x="640" y="100" font-weight="bold" fill="#1A1A2E">🏛️ 4 NUITS — sanctuaire</text>
    <text x="640" y="126" fill="#1A1A2E">FR : « amis du peuple » f61</text>
    <text x="640" y="148" fill="#1A1A2E">JFK : 3 sauvées f61</text>
    <text x="640" y="170" fill="#1A1A2E">« can do for » ☠️ au refrain</text>
    <text x="640" y="196" font-size="11" fill="#1A1A2E">élue relue → gravée f91 🪨</text>
  </g>
  <g stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#fl5)">
    <line x1="242" y1="145" x2="266" y2="145"/><line x1="492" y1="145" x2="516" y2="145"/>
  </g>
  <text x="390" y="256" font-size="13" fill="#1A1A2E" text-anchor="middle">Double dissociation : 🔁 répéter sans comprendre = <tspan font-weight="bold">mourir</tspan> · 💡 comprendre sans répéter = <tspan font-weight="bold">monter</tspan></text>
  <text x="390" y="280" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">Le focus qui tenait la main du cerveau est devenu une loi émergente (leçon 17).</text>
  <text x="390" y="302" font-size="12" fill="#1E9E6A" text-anchor="middle">CHAOS OK — élues gravées f91 des deux côtés : du chaos au marbre, sans aide.</text>
</svg>
