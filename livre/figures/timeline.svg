  <text x="460" y="232" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">42 → 105 contrôles en 2 jours · chaque point est rejouable en une commande · ensuite : l'entraînement Colab (en dernier, sur ordre du chef).</text>
