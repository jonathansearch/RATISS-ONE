<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="2" y="2" width="776" height="326" rx="16" fill="#FAF7F0" stroke="#E8E0D0" stroke-width="2"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1A1A2E" text-anchor="middle">🗣️ Le tokenizer — 4 règles tiny (FR + EN)</text>
  <defs><marker id="fl2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1A1A2E"/></marker></defs>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="70" width="170" height="150" rx="12" fill="#1A1A2E"/>
    <text x="105" y="98" font-weight="bold" fill="#C9A227">R-ULTRA 💎</text>
    <text x="105" y="122" fill="#FAF7F0">des convictions ?</text>
    <text x="105" y="148" font-style="italic" fill="#9AA0B4">« Je tiens pour sûr :</text><text x="105" y="166" font-style="italic" fill="#9AA0B4">amis. »</text>
    <text x="105" y="196" font-size="11" fill="#1E9E6A">EN: I hold as certain…</text>
    <rect x="210" y="70" width="170" height="150" rx="12" fill="#C9A227"/>
