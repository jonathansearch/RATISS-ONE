    <text x="295" y="122" fill="#1A1A2E">un sanctuaire ?</text>
    <text x="295" y="148" font-style="italic" fill="#1A1A2E">« Au sanctuaire :</text><text x="295" y="166" font-style="italic" fill="#1A1A2E">amis du peuple. »</text>
    <text x="295" y="196" font-size="11" fill="#1A1A2E">EN: In the sanctuary…</text>
    <rect x="400" y="70" width="170" height="150" rx="12" fill="#1E9E6A"/>
    <text x="485" y="98" font-weight="bold" fill="#fff">R-TISSU 🕸️</text>
    <text x="485" y="122" fill="#fff">des mots tenus ?</text>
    <text x="485" y="148" font-style="italic" fill="#E9F7EF">« Je tiens amis</text><text x="485" y="166" font-style="italic" fill="#E9F7EF">et peuple… »</text>
    <text x="485" y="196" font-size="11" fill="#fff">EN: I hold…</text>
    <rect x="590" y="70" width="170" height="150" rx="12" fill="#fff" stroke="#6B7280" stroke-width="2"/>
    <text x="675" y="98" font-weight="bold" fill="#1A1A2E">R-VIDE 🕳️</text>
    <text x="675" y="122" fill="#1A1A2E">rien ?</text>
    <text x="675" y="148" font-style="italic" fill="#6B7280">« Je ne tiens rien.</text>
    <text x="675" y="166" font-style="italic" fill="#6B7280">Tout reste dehors. »</text>
    <text x="675" y="196" font-size="11" fill="#6B7280">EN: I hold nothing…</text>
