  <text x="390" y="258" font-size="13" fill="#1A1A2E" text-anchor="middle">Ordre fixe, vides sautés · <tspan font-weight="bold">déterministe</tspan> · <tspan font-weight="bold">zéro singulier</tspan> · état 100 % JSON</text>
  <text x="390" y="282" font-size="12" fill="#6B7280" text-anchor="middle">5 phrases exactes pinnées (EN×3, FR×2) · éducation = robinet à données (20 paires, 20/20)</text>
  <text x="390" y="306" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">La sortie est une traduction, pas une génération (leçon 14).</text>
