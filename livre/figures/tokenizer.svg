  <g stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#fl2)">
    <line x1="192" y1="145" x2="206" y2="145"/><line x1="382" y1="145" x2="396" y2="145"/><line x1="572" y1="145" x2="586" y2="145"/>
